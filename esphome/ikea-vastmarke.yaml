substitutions:
  name: "ikea-vastmarke"
  friendly_name: "IKEA VASTMARKE"

  # GPIO pin assignments (ESP32-C3 Super Mini)
  pin_button: "GPIO4"      # Pad 2 of desoldered MCU (Puck Button SW1, Active-LOW)
  pin_led_pwm: "GPIO5"     # Pad 7 of desoldered MCU (Gate of AO3400 N-MOSFET)
  pin_status_led: "GPIO8"  # Onboard LED (Active-LOW)

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  comment: "IKEA VASTMARKE Qi2 Smart Mod with ESP32-C3"

esp32:
  board: esp32-c3-devkitm-1
  framework:
    type: esp-idf

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  fast_connect: true
  ap:
    ssid: "IKEA-Vastmarke-Fallback"
    password: !secret fallback_ap_password

captive_portal:

logger:
  level: INFO

api:
  reboot_timeout: 0s
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

web_server:
  port: 80

time:
  - platform: homeassistant
    id: ha_time

status_led:
  pin:
    number: ${pin_status_led}
    inverted: true

sensor:
  - platform: wifi_signal
    name: "WiFi Signal"
    update_interval: 60s

  - platform: uptime
    name: "Uptime"

binary_sensor:
  - platform: gpio
    pin:
      number: ${pin_button}
      mode: INPUT_PULLUP
      inverted: true
    name: "Puck Button"
    id: puck_button
    filters:
      - delayed_on_off: 30ms

    on_multi_click:
      # Single click: Toggle mood light
      - timing:
          - ON for at most 400ms
          - OFF for at least 300ms
        then:
          - light.toggle: mood_light

      # Double click: Fire event in Home Assistant (e.g. good night scene)
      - timing:
          - ON for at most 400ms
          - OFF for at most 400ms
          - ON for at most 400ms
        then:
          - homeassistant.event:
              event: esphome.ikea_vastmarke_button
              data:
                action: double_click

      # Long press: Dim light relative
      - timing:
          - ON for at least 600ms
        then:
          - homeassistant.event:
              event: esphome.ikea_vastmarke_button
              data:
                action: long_press
          - light.dim_relative:
              id: mood_light
              relative_brightness: 25%
              transition_length: 300ms

output:
  - platform: ledc
    pin: ${pin_led_pwm}
    id: led_pwm
    frequency: 600Hz
    min_power: 0.20
    max_power: 0.75
    zero_means_zero: true

light:
  - platform: monochromatic
    name: "Mood Light"
    id: mood_light
    output: led_pwm
    default_transition_length: 400ms
    gamma_correct: 1.8
    restore_mode: RESTORE_DEFAULT_OFF
    effects:
      - pulse:
          name: "Gentle Pulse"
          transition_length: 2.0s
          update_interval: 2.0s
          min_brightness: 5%
          max_brightness: 80%
