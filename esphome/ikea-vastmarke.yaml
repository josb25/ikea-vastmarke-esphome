substitutions:
  name: "ikea-vastmarke"
  friendly_name: "IKEA VASTMARKE"

  # GPIO pin assignments (ESP32-C3 Super Mini)
  pin_button: "GPIO4"      # Pad 2 of desoldered MCU (Puck Button SW1, Active-LOW)
  pin_led_pwm: "GPIO5"     # Pad 7 of desoldered MCU (Gate of AO3400 N-MOSFET)
  pin_status_led: "GPIO8"  # Onboard LED (Active-LOW)

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  comment: "IKEA VASTMARKE Qi2 Smart Mod with ESP32-C3"

esp32:
  board: esp32-c3-devkitm-1
  framework:
    type: esp-idf

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  fast_connect: true
  ap:
    ssid: "IKEA-Vastmarke-Fallback"
    password: !secret fallback_ap_password

captive_portal:

logger:
  level: INFO

api:
  reboot_timeout: 0s
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

web_server:
  port: 80

time:
  - platform: homeassistant
    id: ha_time

status_led:
  pin:
    number: ${pin_status_led}
    inverted: true

# Native Home Assistant Event Entity
# Exposes single_press, double_press, and long_press to Home Assistant
event:
  - platform: template
    name: "Button Event"
    id: puck_event
    event_types:
      - single_press
      - double_press
      - long_press

# Configuration Toggle: Enables/disables local lamp toggling on single click
switch:
  - platform: template
    name: "Single Click Controls Lamp"
    id: single_click_controls_lamp
    icon: "mdi:lightbulb-auto"
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    entity_category: config

sensor:
  - platform: wifi_signal
    name: "WiFi Signal"
    update_interval: 60s

  - platform: uptime
    name: "Uptime"

binary_sensor:
  - platform: gpio
    pin:
      number: ${pin_button}
      mode: INPUT_PULLUP
      inverted: true
    name: "Puck Button"
    id: puck_button
    filters:
      - delayed_on_off: 25ms

    on_multi_click:
      # 1. Single Click: Fires event to HA; toggles lamp if toggle switch is ON
      - timing:
          - ON for at most 400ms
          - OFF for at least 250ms
        then:
          - event.trigger:
              id: puck_event
              event_type: single_press
          - homeassistant.event:
              event: esphome.ikea_vastmarke_button
              data:
                action: single_click
          - if:
              condition:
                switch.is_on: single_click_controls_lamp
              then:
                - light.toggle: mood_light

      # 2. Double Click: Fires double_press event to Home Assistant
      - timing:
          - ON for at most 400ms
          - OFF for at most 400ms
          - ON for at most 400ms
          - OFF for at least 200ms
        then:
          - event.trigger:
              id: puck_event
              event_type: double_press
          - homeassistant.event:
              event: esphome.ikea_vastmarke_button
              data:
                action: double_click

      # 3. Long Press (Hold > 500ms): Fires long_press event to Home Assistant
      - timing:
          - ON for at least 500ms
        then:
          - event.trigger:
              id: puck_event
              event_type: long_press
          - homeassistant.event:
              event: esphome.ikea_vastmarke_button
              data:
                action: long_press
          - if:
              condition:
                switch.is_on: single_click_controls_lamp
              then:
                - light.dim_relative:
                    id: mood_light
                    relative_brightness: 25%
                    transition_length: 300ms

output:
  - platform: ledc
    pin: ${pin_led_pwm}
    id: led_pwm
    frequency: 600Hz
    min_power: 0.20
    max_power: 0.75
    zero_means_zero: true

light:
  - platform: monochromatic
    name: "Mood Light"
    id: mood_light
    output: led_pwm
    default_transition_length: 400ms
    gamma_correct: 1.8
    restore_mode: RESTORE_DEFAULT_OFF
    effects:
      - pulse:
          name: "Gentle Pulse"
          transition_length: 2.0s
          update_interval: 2.0s
          min_brightness: 5%
          max_brightness: 80%
